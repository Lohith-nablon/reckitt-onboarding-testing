# Master config for the retailer onboarding POC.
# Every key can be overridden by an environment variable POC_<SECTION>__<KEY>
# (e.g. POC_STORAGE__S3__BUCKET). Secrets are never written here: name the env var instead.

env: dev

storage:
  backend: local                    # local | adls | s3   (Databricks App sets adls in app.yaml)
  local_root: data/store
  adls:                             # Reckitt's lake (Azure Data Lake Storage Gen2)
    account: ""                     # TODO: storage account name
    container: bronze               # filesystem with the landing zone and the app's folders
    prefix: retailer-onboarding-poc
    account_key_env: AZURE_STORAGE_KEY   # or SAS via AZURE_STORAGE_SAS, or managed identity
    sas_token_env: AZURE_STORAGE_SAS
  s3:                               # Nablon AWS dev workspace only
    bucket: ""                      # TODO: POC bucket in Nablon AWS (eu-north-1, Stockholm)
    prefix: retailer-onboarding-poc
    region: eu-north-1
    endpoint_url: null
    access_key_env: AWS_ACCESS_KEY_ID
    secret_key_env: AWS_SECRET_ACCESS_KEY
    session_token_env: AWS_SESSION_TOKEN

paths:                              # folders inside the container / local root
  landing: landing                  # bronze landing zone: raw retailer files as they arrive
  inbox: inbox
  outputs: outputs
  sessions: state/sessions
  mapping_library: library/mappings
  crosswalk: library/crosswalk
  mdm: mdm
  veritas_reference: library/veritas_reference

llm:                                # model serving / AI Gateway. Non-OpenAI models need Reckitt platform approval.
  provider: none                    # none | openai | azure_openai | databricks
  base_url: ""                      # databricks: https://<workspace-host>/serving-endpoints
  model: ""                         # serving endpoint / deployment name
  api_key_env: POC_LLM_API_KEY
  temperature: 0.0
  timeout_s: 60

discovery:
  sample_rows: 20                   # rows per file sent to the LLM (10-20)

thresholds:
  mapping_review: 0.80
  match_auto_accept: 0.90
  match_review_floor: 0.70
  discovery_review: 0.70
  veritas_match_target: 0.95

mdm:
  source: files                     # files (CSV extracts in storage) | uc (Unity Catalog tables)
  product_file: erp_product_master.csv
  customer_file: rb_customer_master.csv
  uc_catalog: ""                    # uc: default uc.bronze_catalog
  uc_schema: rb_master
  product_table: rb_product_master
  customer_table: rb_customer_master
  cache_ttl_s: 3600
  size_warn_mb: 1024

auth:
  mode: none                        # none (local) | databricks_app
  dev_user: local.user@nablon.ai

output:
  format: csv                       # csv | parquet
  preview_rows: 200

warehouse:                          # Unity Catalog through a Databricks SQL warehouse
  backend: local                    # local (DuckDB stand-in) | databricks
  host: ""                          # adb-xxxx.azuredatabricks.net
  http_path: ""                     # /sql/1.0/warehouses/<id>
  token_env: DATABRICKS_TOKEN
  local_root: data/warehouse
  allow_pipeline_run: false         # POC rule: the app never runs Reckitt's pipeline (local stand-in excepted)

uc:                                 # where the pipeline loads bronze and harmonisation writes silver
  bronze_catalog: bronze_dev        # TODO: real catalog / schema names
  bronze_schema: pos
  silver_catalog: silver_dev
  silver_schema: pos
  bronze_tables: {}                 # override per target, e.g. {bronze.pos_sellout: bronze_dev.pos.pos_sellout}
  silver_suffix: _harmonised
  crosswalk_table: ""               # default <silver_catalog>.<silver_schema>.retailer_code_crosswalk
  mapping_table: ""                 # optional Delta table that also receives the mapping JSON + SQL

sql:
  source_mode: read_files           # read_files: SQL reads the raw file from ADLS | table: from a landing table
  landing_table_template: "{bronze_catalog}.landing.{retailer}_{file_stem}"

pipeline:                           # how Phase 2 learns the bronze tables are loaded
  mode: manual                      # manual (person confirms) | job (app starts a Databricks job) | watch_table
  job_id: ""                        # job: set from the app resource "pipeline-job"
  auto_phase2: true                 # start harmonisation (up to Gate B) when the load is done
  poll_seconds: 10

ops:                                # operational Delta tables in <uc.bronze_catalog>.<schema_name>
  schema_name: onboarding
  landing_events_table: onboarding_landing_events
  audit_table: onboarding_audit
  audit: auto                       # auto (on with the Databricks warehouse) | on | off

metrics:                            # red / amber / green on mapping confidence
  green: 0.90
  amber: 0.70
  minutes_per_review: 2
